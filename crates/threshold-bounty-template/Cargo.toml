[package]
name = "threshold-bounty-template"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Experimental Ootle escrow for Tari-style issue bounties"

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
tari_template_lib = { version = "=0.32.1", features = ["borsh"] }
minicbor = { version = "=2.3.0", features = ["derive", "std"] }
blake2 = "=0.10.6"
borsh = "1.6"
serde = { version = "1", features = ["derive"] }

[build-dependencies]
tari_ootle_template_build = "=0.12.0"

[dev-dependencies]
tari_template_test_tooling = "=0.41.2"
tari_engine_types = "=0.41.2"
tari_crypto = "=0.23.2"
ootle_byte_type = { version = "=0.13.0", features = ["crypto"] }
ootle-rs = "=0.23.0"
tari_ootle_transaction = "=0.41.2"
tari_ootle_wallet_crypto = { version = "=0.43.0", features = ["serde"] }
threshold-client = { path = "../threshold-client" }
