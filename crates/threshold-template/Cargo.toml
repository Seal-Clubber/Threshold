[package]
name = "threshold-template"
version.workspace = true
edition.workspace = true
license.workspace = true

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
tari_template_lib = { version = "=0.32.1", features = ["borsh"] }
tari_bor = "=0.16.1"
minicbor = { version = "=2.3.0", features = ["derive", "std"] }
blake2 = "=0.10.6"
borsh = "1.6"

[build-dependencies]
tari_ootle_template_build = "=0.12.0"
