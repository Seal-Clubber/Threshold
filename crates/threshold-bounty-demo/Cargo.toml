[package]
name = "threshold-bounty-demo"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Esmeralda transaction demonstration for configurable Tari-style bounty reviewers"

[dependencies]
threshold-bounty-template = { path = "../threshold-bounty-template" }
threshold-client = { path = "../threshold-client" }
tari_template_lib = { version = "=0.32.1", features = ["serde"] }
tari_engine_types = "=0.41.2"
tari_ootle_transaction = "=0.41.2"
tari_ootle_wallet_crypto = { version = "=0.43.0", features = ["serde"] }
ootle-rs = "=0.23.0"
ootle_byte_type = { version = "=0.13.0", features = ["crypto"] }
tari_crypto = "=0.23.2"
tari_utilities = "=0.10.0"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "time"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
anyhow = "1"
hex = "0.4"
rand = "0.10"
